<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Inventory — MOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Login Gate -->
  <div class="login-gate" id="loginGate">
    <div class="login-box">
      <h1>MOME</h1>
      <p>Enter your admin password to continue.</p>
      <form id="loginForm">
        <p class="login-error" id="loginError">Incorrect password. Try again.</p>
        <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="admin-btn admin-btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <header class="admin-header">
      <h1>MOME <span>Admin</span></h1>
      <div class="admin-header-actions">
        <a href="../index.html" target="_blank">View Store →</a>
        <button class="admin-btn admin-btn-secondary" id="logoutBtn" style="width:auto;padding:0.5rem 1rem;">Log Out</button>
      </div>
    </header>

    <nav class="admin-tabs" id="adminTabs">
      <button type="button" class="admin-tab active" data-tab="products">Products</button>
      <button type="button" class="admin-tab" data-tab="orders">Orders</button>
    </nav>

    <div class="admin-tab-panel" id="productsPanel">
    <div class="admin-layout">
      <!-- Add / Edit Form -->
      <div class="admin-panel">
        <h2 id="formTitle">Add New Product</h2>
        <form class="admin-form" id="productForm">
          <div class="form-row">
            <label for="prodName">Product Name *</label>
            <input type="text" id="prodName" required placeholder="e.g. Linen Overshirt">
          </div>
          <div class="form-row">
            <label for="prodCategory">Category *</label>
            <input type="text" id="prodCategory" required placeholder="e.g. Tops, Bottoms, Knitwear" list="categoryList">
            <datalist id="categoryList">
              <option value="Tops">
              <option value="Bottoms">
              <option value="Knitwear">
              <option value="Outerwear">
              <option value="Accessories">
            </datalist>
          </div>
          <div class="form-row">
            <label for="prodDesc">Description</label>
            <textarea id="prodDesc" placeholder="Short product description…"></textarea>
          </div>
          <div class="form-row form-row-inline">
            <div>
              <label for="prodPrice">Price ($) *</label>
              <input type="number" id="prodPrice" required min="0" step="1" placeholder="89">
            </div>
            <div>
              <label for="prodSize">Sizes</label>
              <input type="text" id="prodSize" placeholder="S – XL">
            </div>
          </div>
          <div class="form-row">
            <label for="prodImageFile">Product Image *</label>
            <input type="file" id="prodImageFile" accept="image/*">
            <p class="form-help">Upload an image file, or paste an image URL below.</p>
            <input type="url" id="prodImage" placeholder="https://images.unsplash.com/…">
            <div class="image-preview" id="prodImagePreviewWrap" hidden>
              <img id="prodImagePreview" alt="Selected product preview">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="admin-btn admin-btn-secondary" id="cancelEdit" style="display:none;">Cancel</button>
            <button type="submit" class="admin-btn admin-btn-primary" id="submitBtn">Add Product</button>
          </div>
        </form>
      </div>

      <!-- Product List -->
      <div class="admin-panel">
        <div class="admin-list-header">
          <h2>All Products</h2>
          <span class="product-count" id="productCount"></span>
        </div>
        <div class="admin-product-list" id="adminProductList"></div>
      </div>
    </div>
    </div>

    <div class="admin-tab-panel" id="ordersPanel" hidden>
      <div class="admin-panel admin-orders-panel">
        <div class="admin-list-header">
          <h2>All Orders</h2>
          <span class="product-count" id="orderCount"></span>
        </div>
        <div class="admin-order-list" id="adminOrderList"></div>
      </div>
    </div>
  </div>

  <div class="admin-toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
